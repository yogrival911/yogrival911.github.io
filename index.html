<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YogDroidTech</title>
<meta name="description" content="Mobile games and apps by YogDroidTech.">
<style>
  :root { --bg: #FFF6E6; --fg: #16183A; --muted: #4A4D6E; --card: #FFFFFF; --sun: #FFC83D; --line: #E8DDC8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16183A; --fg: #FFF6E6; --muted: #B9BAD0; --card: #22265A; --line: #2B3070; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.6; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 22px 72px; }
  h1 { font-size: 2.2rem; margin: 0 0 6px; line-height: 1.1; }
  .tag { color: var(--muted); margin: 0 0 40px; font-size: 1.05rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px; }
  .row { display: flex; gap: 16px; align-items: center; }
  .icon { width: 56px; height: 56px; flex: none; border-radius: 15px; background: var(--sun); color: #16183A;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 28px; }
  h2 { font-size: 1.25rem; margin: 0; }
  .card p { margin: 12px 0 16px; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 10px; }
  .links a { color: inherit; text-decoration: none; font-weight: 600; font-size: .95rem;
    border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; }
  .links a:hover { border-color: var(--sun); }
  footer { margin-top: 48px; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>YogDroidTech</h1>
  <p class="tag">Simple, fun mobile games and apps.</p>

  <section class="card">
    <div class="row">
      <div class="icon" aria-hidden="true">Σ</div>
      <h2>Daily Sum: Number Puzzle</h2>
    </div>
    <p>Swipe tiles to hit the target sum. A new 60-second number puzzle every day.</p>
    <div class="links">
      <a href="/sum-puzzle-game/privacy-policy.html">Privacy policy</a>
      <a href="/sum-puzzle-game/request-deletion.html">Request data deletion</a>
    </div>
  </section>

  <footer>© 2026 YogDroidTech</footer>
</main>
</body>
</html>
